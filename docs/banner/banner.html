<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&display=block" rel="stylesheet">
<style>
  /* Index-card colours: cream stock, blue rules, red header rule */
  :root { --ink: #1F2937; --muted: rgba(31, 41, 55, 0.66); --accent: #3E7BC4; --rule: rgba(62, 123, 196, 0.11); --red: rgba(214, 96, 84, 0.45); }
  html, body { margin: 0; width: 1280px; height: 440px; background: transparent; }
  .canvas {
    position: relative; width: 1280px; height: 440px; overflow: hidden; border-radius: 24px;
    font-family: "Lexend", sans-serif; color: var(--ink);
    background:
      radial-gradient(900px 520px at 88% 30%, rgba(62, 123, 196, 0.15), transparent 62%),
      radial-gradient(700px 500px at 0% 100%, rgba(255, 255, 255, 0.75), transparent 60%),
      linear-gradient(135deg, #FBFAF5 0%, #F3F0E7 55%, #EAE5D8 100%);
  }
  /* Ruled lines like an index card, fading out behind the text */
  .rules {
    position: absolute; inset: 0;
    background:
      linear-gradient(var(--red), var(--red)) 0 70px / 100% 1.5px no-repeat,
      repeating-linear-gradient(180deg, transparent 0 101px, var(--rule) 101px 102px, transparent 102px 134px);
    background-position: 0 70px, 0 0;
    mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0.35) 0%, black 45%, black 100%);
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .wordmark { display: flex; align-items: center; gap: 16px; }
  .wordmark h1 { margin: 0; font-size: 58px; font-weight: 600; letter-spacing: -1.6px; line-height: 1; }
  .wordmark h1 span { color: var(--accent); }
  .mark { width: 55px; height: 47px; flex: none; margin-top: 4px; }
  .tagline { font-size: 19px; line-height: 1.5; margin: 22px 0 0; }
  .tagline span { color: var(--muted); }
  .pills { display: flex; gap: 10px; margin-top: 26px; }
  .pill {
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
    padding: 8px 15px; border-radius: 999px;
    box-shadow: inset 0 0 0 1.5px rgba(31, 41, 55, 0.3); background: rgba(255, 255, 255, 0.45);
  }
  /* App windows */
  .stage { position: absolute; left: 560px; top: 0; right: 0; bottom: 0; perspective: 1700px; }
  .win {
    position: absolute; border-radius: 12px; overflow: hidden; background: #fff;
    box-shadow: 0 30px 70px rgba(31, 41, 55, 0.26), 0 6px 18px rgba(31, 41, 55, 0.12), 0 0 0 1px rgba(31, 41, 55, 0.12);
    transform: rotateY(-16deg) rotateX(5deg) rotateZ(1deg);
  }
  /* Each window shows a crop of a screenshot: the img is scaled up and offset inside it */
  .win img { position: absolute; display: block; }
</style>
</head>
<body>
<div class="canvas">
  <div class="rules"></div>
  <div class="copy">
    <div class="wordmark">
      <h1>flashcards<span>.md</span></h1>
      <!-- Two stacked cards -->
      <svg class="mark" viewBox="0 0 66 56" xmlns="http://www.w3.org/2000/svg">
        <rect x="16" y="3" width="44" height="32" rx="5" transform="rotate(9 38 19)" fill="#3E7BC4"/>
        <rect x="4" y="18" width="46" height="34" rx="5" fill="#1F2937"/>
        <rect x="12" y="29" width="22" height="4" rx="2" fill="#FBFAF5"/>
        <rect x="12" y="38" width="30" height="4" rx="2" fill="#FBFAF5" opacity="0.5"/>
      </svg>
    </div>
    <p class="tagline">Simple flashcards for your Obsidian vault.</p>
    <div class="pills"><span class="pill">Free</span><span class="pill">Open Source</span><span class="pill">Plain Markdown</span></div>
  </div>
  <div class="stage">
    <!-- Each screenshot below is already cropped to the card; the windows show a 1400x888 crop at (4, 40) -->
    <!-- Typed answer, checked -->
    <div class="win" style="width:400px;height:255px;left:300px;top:22px;opacity:.96"><img src="../flashcard_typed_answered.png" alt="" style="width:402px;left:-1px;top:-11px"></div>
    <!-- Multiple choice, answered -->
    <div class="win" style="width:420px;height:266px;left:10px;top:70px"><img src="../flashcard_choice_answered.png" alt="" style="width:422px;left:-1px;top:-12px"></div>
    <!-- Front -->
    <div class="win" style="width:460px;height:292px;left:190px;top:128px"><img src="../flashcard_front.png" alt="" style="width:463px;left:-1px;top:-13px"></div>
  </div>
</div>
</body>
</html>
